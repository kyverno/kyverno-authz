apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: agentrouter-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      automountServiceAccountToken: false
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.3.3
          args: [start-dev, --import-realm]
          env:
            - name: KC_HOSTNAME
              value: http://keycloak.agentrouter-demo.svc.cluster.local:8080
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - containerPort: 8080
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm
          secret:
            secretName: demo-identity
            items:
              - key: realm.json
                path: demo-realm.json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kyverno-authz
  namespace: agentrouter-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kyverno-authz
  template:
    metadata:
      labels:
        app: kyverno-authz
    spec:
      serviceAccountName: kyverno-authz
      containers:
        - name: authz
          image: ko.local/github.com/kyverno/kyverno-authz:agentrouter-extproc
          imagePullPolicy: Never
          args:
            - serve
            - envoy
            - authz-server
            - --grpc-address=:9081
            - --extproc-address=:9083
            - --probes-address=:9080
            - --kube-policy-source=false
            - --external-policy-source=file:///policies
            - --openreports-enabled=true
            - --report-flush-interval=2s
            - --result-buffer-size=200
            - "--log-msg-format=[%[1]s] request=%[2]s decision=%[3]s\n"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 9081
            - containerPort: 9083
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9080
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
      volumes:
        - name: policies
          projected:
            sources:
              - configMap:
                  name: demo-policies
              - configMap:
                  name: demo-exceptions
                  optional: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-tools
  namespace: agentrouter-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-tools
  template:
    metadata:
      labels:
        app: kube-tools
    spec:
      serviceAccountName: kube-tools
      containers:
        - name: mcp
          image: python:3.13.7-alpine3.22
          command: [python3, -u, /app/server.py]
          env:
            - name: MCP_BACKEND
              value: kubernetes
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: server
              mountPath: /app
              readOnly: true
      volumes:
        - name: server
          configMap:
            name: mcp-server
---
